<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary · Munan.hub</title>
<meta name="description" content="A private, dated diary with sections — write, revisit, and export your entries.">

<!-- Fonts (site-wide Poppins / Hind Siliguri, plus Fraunces as this page's own display face) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">

<!-- Font Awesome (footer.js renders fa-* icons; navbar/diary UI also use it) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Shared theme logic — blocking, must run before first paint -->
<script src="theme.js"></script>

<!-- Shared site stylesheet -->
<link rel="stylesheet" href="style.css">

<style>
    /* ============================================================
       Page-specific styles — Diary
       Reuses --card-bg, --card-border, --accent, --text-* tokens
       from style.css so light/dark theming stays in sync site-wide.

       This page also defines its own --ink / --ink-soft tokens below,
       plus a brown→orange ambient gradient — a small, page-scoped
       "journal" identity layered on top of the shared design system.
       --accent is never touched, so every other page keeps looking
       exactly as it does today.
       ============================================================ */

    :root {
        --ink: #3a2413;                    /* espresso ink — headings, dates, dividers */
        --ink-soft: #7a5a3c;
    }
    [data-theme="dark"] {
        --ink: #f0b673;                    /* warm amber on dark — like coals catching light */
        --ink-soft: #c98d54;
    }

    /* ── BODY OVERRIDE (identical to TypeMaster.html) ────────── */
    body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        min-height: 100vh;
    }

    /* Brown → orange ambient gradient, replacing the site's colour blobs
       on this page only. Direction AND colour order both flip in dark
       mode (135deg cream→brown becomes 315deg near-black→amber) so it
       genuinely reads as dark, not just the same gradient dimmed. */
    .blobs { display: none; }
    body::before {
        content: "";
        position: fixed; inset: 0; z-index: -1;
        background: linear-gradient(135deg, #fff6ec 0%, #ffd9ad 32%, #f2a15c 66%, #b8632b 100%);
        pointer-events: none;
    }
    [data-theme="dark"] body::before {
        background: linear-gradient(315deg, #0c0603 0%, #2b160a 32%, #5c2f14 66%, #93481c 100%);
    }

    /* ── NAVBAR OVERRIDE (identical to TypeMaster.html) ──────── */
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(255,255,255,.55); border: 1.5px solid rgba(255,255,255,.6);
        border-radius: 12px; padding: 6px 14px 6px 10px;
        font-size: .78rem; font-weight: 600; color: var(--text-main);
        backdrop-filter: blur(8px); transition: var(--trans);
    }
    .nav-btn:hover { background: rgba(255,255,255,.85); border-color: #7ec8e8; }
    .nav-btn-icon {
        width: 24px; height: 24px; border-radius: 6px;
        background: linear-gradient(135deg,#5bb8e8,#2e8fc7);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: .7rem; flex-shrink: 0;
    }

    /* ── PAGE SHELL ──────────────────────────────────────────── */
    /* Narrower than before (760 vs 880) — a diary reads better as an
       intimate column than a wide dashboard. */
    .page-content {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 20px 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 1;
    }

    /* ── HEADER ───────────────────────────────────────────────── */
    header { text-align: center; padding: 14px 0 6px; }
    .logo-main {
        font-size: 3rem; font-weight: 800; letter-spacing: -2px;
        color: var(--text-main); display: block; line-height: 1.15;
    }
    .logo-main span {
        font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
        letter-spacing: -1px; color: var(--accent);
    }
    .logo-sub {
        font-size: .72rem; font-weight: 400; letter-spacing: 3px;
        color: var(--text-soft); text-transform: uppercase;
        margin-top: 9px; display: block;
    }

    /* ── TABS ─────────────────────────────────────────────────── */
    /* An index-tab / chapter-divider treatment instead of pill
       buttons — a moving underline rather than a filled background. */
    .diary-tabs {
        display: flex; gap: 28px;
        width: max-content; margin: 0 auto 32px;
        border-bottom: 1px solid var(--card-border);
        animation: fadeUp .6s ease .05s both;
    }
    .diary-tab {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 10px 2px 16px; border-radius: 0;
        background: none; border: none;
        color: var(--text-soft); font-size: .78rem; font-weight: 700;
        letter-spacing: .09em; text-transform: uppercase;
        cursor: pointer; position: relative; transition: color .25s ease;
    }
    .diary-tab::after {
        content: ""; position: absolute; left: 0; right: 100%; bottom: -1px;
        height: 2px; background: var(--accent);
        transition: right .3s cubic-bezier(.4,0,.2,1);
    }
    .diary-tab:hover { color: var(--text-main); }
    .diary-tab.active { color: var(--ink); }
    .diary-tab.active::after { right: 0; }

    .diary-view {
        display: none; animation: fadeUp .45s ease both;
        background: var(--card-bg); border: 1px solid var(--card-border);
        border-radius: 16px; padding: 34px 34px 38px;
        backdrop-filter: blur(16px); box-shadow: 0 20px 50px rgba(0,0,0,.12);
    }
    .diary-view.active { display: block; }

    /* ── WRITE: DATE/TIME ROW ────────────────────────────────── */
    .diary-card { margin-bottom: 22px; }
    /* Strip the shared glass-card look (.card, from style.css) for this
       one instance — the write view now reads as an open page, not a
       boxed panel. Scoped to `.diary-card.card` so nothing else on the
       site is affected. */
    .diary-card.card {
        background: transparent !important; border: none !important;
        backdrop-filter: none !important; box-shadow: none !important;
        padding: 0 !important;
    }
    .diary-datetime-row {
        display: flex; gap: 28px; flex-wrap: wrap; width: 100%;
    }
    .diary-field { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
    .diary-field label {
        font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
        font-size: .82rem; letter-spacing: .01em; color: var(--ink-soft);
    }
    .diary-field input[type="date"],
    .diary-field input[type="time"],
    .diary-field input[type="text"],
    .diary-field textarea {
        font-family: inherit; font-size: .92rem; color: var(--text-main);
        background: transparent; border: none; border-bottom: 1.5px solid var(--card-border);
        border-radius: 0; padding: 8px 2px; transition: var(--trans);
        width: 100%;
    }
    .diary-field input:focus, .diary-field textarea:focus {
        outline: none; border-bottom-color: var(--accent);
        background: transparent; box-shadow: none;
    }

    /* ── SECTIONS ─────────────────────────────────────────────── */
    /* No more boxed cards — each section is a page turn, separated
       by a hairline rule, so writing feels continuous rather than
       "filling in a form". */
    .diary-sections { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 34px; }
    .diary-section {
        background: none; border: none; border-top: 1px solid var(--card-border);
        border-radius: 0; padding: 22px 0 6px; position: relative;
        animation: cardIn .35s ease both;
    }
    .diary-section:first-child { border-top: none; padding-top: 0; }
    .diary-section:hover { background: rgba(0,0,0,.015); }
    [data-theme="dark"] .diary-section:hover { background: rgba(255,255,255,.02); }
    .diary-section-head {
        display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .diary-section-head input[type="text"] {
        flex: 1; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
        font-size: .98rem; background: transparent; border: none;
        border-bottom: 1.5px solid transparent; border-radius: 0;
        padding: 4px 2px; color: var(--ink); transition: var(--trans);
    }
    .diary-section-head input[type="text"]:focus {
        outline: none; border-bottom-color: var(--accent); box-shadow: none; background: transparent;
    }
    .diary-section-remove {
        width: 24px; height: 24px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: none; border: none;
        border-radius: 50%; color: var(--text-soft); font-size: .7rem; cursor: pointer;
        transition: var(--trans);
    }
    .diary-section-remove:hover { background: rgba(239,68,68,.12); color: #ef4444; }
    .diary-section textarea {
        width: 100%; box-sizing: border-box;
        min-height: 120px; resize: vertical; line-height: 1.85;
        background: transparent; border: none; border-radius: 0;
        padding: 6px 2px 0; font-size: .92rem; color: var(--text-main);
    }
    .diary-section textarea:focus { outline: none; box-shadow: none; background: transparent; }

    .diary-add-section {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 20px; padding: 12px 0;
        background: none; border: none; border-top: 1px dashed var(--card-border);
        border-radius: 0; color: var(--accent); font-size: .78rem; font-weight: 700;
        letter-spacing: .05em; text-transform: uppercase;
        cursor: pointer; transition: var(--trans); width: 100%; justify-content: center;
    }
    .diary-add-section:hover { color: var(--ink); }
    .diary-add-section:disabled,
    .diary-add-section[hidden] { display: none; }
    .diary-section-cap { text-align: center; font-size: .72rem; color: var(--text-soft); margin-top: 10px; }

    /* ── WRITE ACTIONS ────────────────────────────────────────── */
    .diary-actions {
        display: flex; gap: 14px; flex-wrap: wrap; margin-top: 30px;
    }
    .diary-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 26px; border-radius: 8px; border: 1.5px solid transparent;
        font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
        cursor: pointer; transition: var(--trans);
        font-family: inherit;
    }
    .diary-btn-primary { background: var(--accent); color: #fff; }
    .diary-btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 10px 26px rgba(2,132,199,.28); }
    [data-theme="dark"] .diary-btn-primary { color: #020617; }
    .diary-btn-ghost {
        background: none; border-color: transparent; color: var(--text-soft);
    }
    .diary-btn-ghost:hover { color: var(--ink); }
    .diary-btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .diary-editing-banner {
        display: none; align-items: center; gap: 10px;
        background: rgba(2,132,199,.06); border: none; border-left: 3px solid var(--accent);
        border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 18px;
        font-size: .78rem; color: var(--ink); font-weight: 600;
    }
    .diary-editing-banner.active { display: flex; }
    .diary-editing-banner button {
        margin-left: auto; background: none; border: none; color: var(--accent);
        font-size: .75rem; font-weight: 700; cursor: pointer; text-decoration: underline;
        font-family: inherit;
    }

    /* ── HISTORY ──────────────────────────────────────────────── */
    .diary-history-toolbar {
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 14px; margin-bottom: 22px;
        padding-bottom: 16px; border-bottom: 1px solid var(--card-border);
    }
    .diary-filter-group {
        display: inline-flex; gap: 20px; background: none; border: none; padding: 0;
    }
    .diary-filter-btn {
        padding: 4px 0; border-radius: 0; border: none; border-bottom: 2px solid transparent;
        background: none;
        color: var(--text-soft); font-size: .74rem; font-weight: 700; letter-spacing: .05em;
        text-transform: uppercase; cursor: pointer; transition: var(--trans); font-family: inherit;
    }
    .diary-filter-btn.active { border-bottom-color: var(--accent); color: var(--ink); }

    .diary-pdf-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 18px; border-radius: 8px;
        background: none; border: 1.5px solid var(--card-border);
        color: var(--ink); font-size: .74rem; font-weight: 700; letter-spacing: .04em;
        text-transform: uppercase;
        transition: var(--trans); font-family: inherit; cursor: pointer;
    }
    .diary-pdf-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    [data-theme="dark"] .diary-pdf-btn:hover { color: #020617; }
    .diary-pdf-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Each row's left border, run edge-to-edge with no gap between
       rows, reads as a continuous spine — a ledger of moments rather
       than a stack of separate cards. */
    .diary-entry-list { display: flex; flex-direction: column; }
    .diary-entry {
        display: flex; align-items: center; gap: 16px;
        background: none; border: none;
        border-left: 2px solid var(--card-border); border-bottom: 1px solid var(--card-border);
        border-radius: 0; padding: 17px 8px 17px 20px; cursor: pointer;
        transition: var(--trans);
        animation: cardIn .4s ease both;
    }
    .diary-entry:last-child { border-bottom: none; }
    .diary-entry:hover { border-left-color: var(--accent); transform: translateX(5px); }
    .diary-entry-date {
        flex-shrink: 0; width: 52px; text-align: left;
        display: flex; flex-direction: column;
        padding: 0; border-radius: 0; background: none; color: var(--ink);
    }
    .diary-entry-date .d { font-family: 'Fraunces', serif; font-size: 1.55rem; font-weight: 600; line-height: 1; color: var(--ink); }
    .diary-entry-date .m { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); margin-top: 3px; }
    .diary-entry-body { flex: 1; min-width: 0; }
    .diary-entry-title { font-size: .88rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .diary-entry-snippet { font-size: .78rem; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .diary-entry-time { flex-shrink: 0; font-size: .72rem; color: var(--text-soft); font-weight: 600; }
    .diary-entry-arrow { flex-shrink: 0; color: var(--text-soft); font-size: .72rem; transition: var(--trans); }
    .diary-entry:hover .diary-entry-arrow { color: var(--accent); transform: translateX(3px); }

    .diary-empty {
        text-align: center; padding: 60px 20px; color: var(--text-soft);
    }
    .diary-empty i { font-size: 2rem; margin-bottom: 14px; opacity: .4; display: block; color: var(--ink-soft); }
    .diary-empty p { font-size: .85rem; }

    /* ── READ OVERLAY (view-only entry detail, opened from History) ── */
    .diary-read-overlay {
        position: fixed; inset: 0; z-index: 1500;
        display: none; align-items: flex-start; justify-content: center;
        background: rgba(2,6,23,.6); backdrop-filter: blur(8px);
        padding: 60px 20px; overflow-y: auto;
    }
    .diary-read-overlay.show { display: flex; }
    .diary-read-card {
        width: 100%; max-width: 600px; position: relative;
        background: var(--card-bg); border: 1px solid var(--card-border);
        border-radius: 4px 4px 16px 16px; padding: 38px 36px 40px;
        backdrop-filter: blur(16px); box-shadow: 0 30px 70px rgba(0,0,0,.32);
        animation: cardIn .35s ease both;
    }
    /* The signature touch: a small bookmark ribbon, like the one
       stitched into a bound journal, marking the page you're on. */
    .diary-read-card::before {
        content: ""; position: absolute; top: -2px; left: 40px; width: 26px; height: 42px;
        background: var(--ink);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
    }
    .diary-read-toolbar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 26px;
    }
    .diary-read-back {
        display: inline-flex; align-items: center; gap: 6px;
        background: none; border: none; color: var(--text-soft);
        font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
        cursor: pointer; font-family: inherit;
        padding: 6px 4px;
    }
    .diary-read-back:hover { color: var(--ink); }
    .diary-read-edit-btn {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 18px; border-radius: 8px;
        background: var(--accent); border: 1.5px solid var(--accent);
        color: #fff; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
        cursor: pointer; transition: var(--trans); font-family: inherit;
    }
    .diary-read-edit-btn:hover { filter: brightness(1.08); }
    [data-theme="dark"] .diary-read-edit-btn { color: #020617; }

    .diary-read-header {
        margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border);
    }
    .diary-read-date { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600; color: var(--ink); letter-spacing: -.3px; }
    .diary-read-time { font-size: .76rem; font-weight: 600; color: var(--text-soft); margin-top: 5px; letter-spacing: .03em; text-transform: uppercase; }

    .diary-read-sections { display: flex; flex-direction: column; gap: 28px; }
    .diary-read-section-title {
        font-size: .7rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: .1em; color: var(--accent); margin-bottom: 9px;
    }
    .diary-read-section-body {
        font-size: .95rem; line-height: 1.9; color: var(--text-main);
        white-space: pre-wrap;
    }

    .diary-loading {
        text-align: center; padding: 40px 20px; color: var(--text-soft); font-size: .85rem;
    }
    .diary-loading i { margin-right: 8px; }

    /* ── TOAST ────────────────────────────────────────────────── */
    /* Uses fixed, explicit colors rather than var(--text-main)/var(--main-bg).
       Those theme variables were resolving to the same value (or to nothing)
       at the moment the toast fired, producing invisible black-on-black
       text. Hardcoding the palette here makes the toast legible regardless
       of theme state, load order, or which page injected diary.js. */
    .diary-toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: #1e293b; color: #f8fafc;
        padding: 12px 22px; border-radius: 10px; font-size: .82rem; font-weight: 600;
        box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 3000;
        opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
        display: flex; align-items: center; gap: 8px;
    }
    .diary-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .diary-toast.error { background: #ef4444; color: #fff; }

    /* ── AUTH GATE OVERLAY ────────────────────────────────────── */
    .diary-gate {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; align-items: center; justify-content: center;
        background: rgba(2,6,23,.55); backdrop-filter: blur(6px);
        padding: 20px;
    }
    .diary-gate-card {
        max-width: 380px; width: 100%; text-align: center;
        background: var(--card-bg); border: 1px solid var(--card-border);
        border-radius: 14px; padding: 38px 30px; backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(0,0,0,.3);
        animation: cardIn .4s ease both;
    }
    .diary-gate-card i.lock-icon {
        width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 18px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(2,132,199,.1); color: var(--accent); font-size: 1.35rem;
    }
    .diary-gate-card h2 { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
    .diary-gate-card p { font-size: .82rem; color: var(--text-soft); margin-bottom: 24px; line-height: 1.6; }
    .diary-gate-card a.diary-btn { text-decoration: none; }

    /* Checking-session state (before we know auth status) */
    .diary-checking { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; }
    .diary-checking i { font-size: 1.6rem; }

    /* ── RESPONSIVE ───────────────────────────────────────────── */
    @media (max-width: 600px) {
        .page-content { padding: 66px 12px 32px; }
        .logo-main { font-size: 2.1rem; }
        .diary-tabs { gap: 22px; }
        .diary-view { padding: 26px 20px 30px; }
        .diary-datetime-row { flex-direction: column; }
        .diary-history-toolbar { flex-direction: column; align-items: stretch; }
        .diary-filter-group { justify-content: center; }
        .diary-pdf-btn { justify-content: center; }
        .diary-entry-time { display: none; }
        .diary-read-overlay { padding: 36px 14px; align-items: center; }
        .diary-read-card { padding: 28px 22px 32px; }
        .diary-read-card::before { left: 20px; }
    }
</style>
</head>
<body>

<!-- ── AMBIENT BACKGROUND (kept in markup for consistency with other pages;
     hidden on this page via CSS above, replaced by the dot-grid) ── -->
<div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<!-- ── NAVBAR (identical structure to TypeMaster.html) ── -->
<nav class="navbar" id="navbar">
    <div class="nav-logo">Munan<span>.hub</span></div>
    <div class="nav-links">
        <a href="index.html" class="nav-btn">
            <span class="nav-btn-icon"><i class="fas fa-home"></i></span>
            Home
        </a>
    </div>
</nav>

<div class="page-content">

<!-- ── AUTH GATE (shown while checking session, or when logged out) ── -->
<div class="diary-gate" id="diary-gate">
    <div id="diary-gate-content">
        <div class="diary-checking">
            <i class="fas fa-circle-notch fa-spin"></i>
            <span>Checking your session…</span>
        </div>
    </div>
</div>

<!-- ════════════════ MAIN APP (hidden until auth confirms) ════════════════ -->
<div id="diary-app" style="display:none;">

    <header>
        <span class="logo-main">Munan's <span>Diary</span></span>
        <span class="logo-sub">Write &nbsp;·&nbsp; Organize &nbsp;·&nbsp; Revisit</span>
    </header>

    <div class="diary-tabs">
        <button class="diary-tab active" data-tab="write">Write</button>
        <button class="diary-tab" data-tab="history">History</button>
    </div>

    <!-- ════════════════ WRITE VIEW ════════════════ -->
    <section class="diary-view active" id="view-write">

        <div class="diary-editing-banner" id="editing-banner">
            <i class="fas fa-pen-to-square"></i>
            <span id="editing-banner-text">Editing an existing entry</span>
            <button id="cancel-edit-btn" type="button">Start new instead</button>
        </div>

        <div class="card diary-card" style="align-items:stretch;">
            <div class="diary-datetime-row">
                <div class="diary-field">
                    <label for="entry-date">Date</label>
                    <input type="date" id="entry-date">
                </div>
                <div class="diary-field">
                    <label for="entry-time">Time</label>
                    <input type="time" id="entry-time">
                </div>
            </div>

            <div class="diary-sections" id="sections-container">
                <!-- sections injected by JS -->
            </div>

            <button class="diary-add-section" id="add-section-btn" type="button">
                <i class="fas fa-plus"></i> Add Section
            </button>
            <div class="diary-section-cap" id="section-cap-msg" style="display:none;">Maximum of 10 sections reached</div>
        </div>

        <div class="diary-actions">
            <button class="diary-btn diary-btn-primary" id="save-entry-btn" type="button">
                <i class="fas fa-floppy-disk"></i> <span id="save-btn-label">Save Entry</span>
            </button>
            <button class="diary-btn diary-btn-ghost" id="clear-form-btn" type="button">
                <i class="fas fa-rotate-left"></i> Clear
            </button>
        </div>

    </section>

    <!-- ════════════════ HISTORY VIEW ════════════════ -->
    <section class="diary-view" id="view-history">

        <div class="diary-history-toolbar">
            <div class="diary-filter-group" role="group" aria-label="Entry limit filter">
                <button class="diary-filter-btn active" data-limit="10">Last 10</button>
                <button class="diary-filter-btn" data-limit="50">Last 50</button>
                <button class="diary-filter-btn" data-limit="all">All</button>
            </div>
            <button class="diary-pdf-btn" id="download-pdf-btn">
                <i class="fas fa-file-pdf"></i> Download PDF
            </button>
        </div>

        <div class="diary-entry-list" id="entry-list">
            <div class="diary-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading entries…</div>
        </div>

    </section>

</div><!-- /#diary-app -->

</div><!-- /.page-content -->

<!-- ── READ OVERLAY (view-only entry detail — opened by clicking a History row) ── -->
<div class="diary-read-overlay" id="diary-read-overlay">
    <div class="diary-read-card">
        <div class="diary-read-toolbar">
            <button class="diary-read-back" id="diary-read-back-btn" type="button">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button class="diary-read-edit-btn" id="diary-read-edit-btn" type="button">
                <i class="fas fa-pen"></i> Edit
            </button>
        </div>
        <div class="diary-read-header">
            <div class="diary-read-date" id="diary-read-date"></div>
            <div class="diary-read-time" id="diary-read-time"></div>
        </div>
        <div class="diary-read-sections" id="diary-read-sections"></div>
    </div>
</div>

<!-- Toast -->
<div class="diary-toast" id="diary-toast"></div>

<!-- ── html2pdf.js (client-side PDF export, per Munan's choice) ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ── Firebase (same project as login.html / moneytracker.html / auth.js) ── -->
<script type="module" src="diary.js"></script>

<!-- ── Shared footer injector ── -->
<script src="footer.js"></script>

</body>
</html>
